<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAYSLIP//CORE</title>
<style>
:root{--bg:#04060d;--p:#0b1222;--line:rgba(80,140,255,.18);--tx:#dbe6ff;--mu:#7e8fb5;--c:#22e4ff;--m:#ff2bd6;--v:#8b5cf6;--g:#a3ff12;--a:#ffb020;--r:#ff4d6d}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.22),transparent),radial-gradient(700px 500px at -5% 10%,rgba(34,228,255,.15),transparent),var(--bg);color:var(--tx);
font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px;opacity:.22;pointer-events:none;mask-image:linear-gradient(#000,transparent 80%)}
.mono,.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 28px;background:rgba(4,6,13,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.28em;font-size:15px;background:linear-gradient(90deg,var(--c),var(--m));-webkit-background-clip:text;color:transparent}
.logo i{font-style:normal;color:var(--c);-webkit-text-fill-color:var(--c);text-shadow:0 0 12px var(--c)}
.dir{color:var(--mu);font-size:12px;flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mu)}.dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:pl 2s infinite}
@keyframes pl{50%{opacity:.35}}
button,select,input{font:inherit;color:var(--tx);background:rgba(20,32,60,.7);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
button{cursor:pointer;transition:.2s}button:hover{border-color:var(--c);box-shadow:0 0 14px rgba(34,228,255,.35)}
nav{display:flex;gap:6px;padding:14px 28px 0;flex-wrap:wrap}
nav button{border-radius:999px;letter-spacing:.08em;font-size:12px;text-transform:uppercase;color:var(--mu)}
nav button.on{color:#04101a;background:linear-gradient(90deg,var(--c),#7aa8ff);border-color:transparent;box-shadow:0 0 18px rgba(34,228,255,.5)}
main{padding:20px 28px 60px;max-width:1500px;margin:auto}
.grid{display:grid;gap:16px}.k{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}
.card{background:linear-gradient(160deg,rgba(18,28,54,.85),rgba(8,13,28,.85));border:1px solid var(--line);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,var(--ac,var(--c)),transparent)}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);font-weight:600}
.kv{font-size:30px;font-weight:700;letter-spacing:-.02em;text-shadow:0 0 22px color-mix(in srgb,var(--ac,var(--c)) 55%,transparent)}
.sub{font-size:12px;color:var(--mu);margin-top:4px}.up{color:var(--g)}.dn{color:var(--r)}
.cv{height:300px;position:relative}.cv.t{height:360px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase}th:first-child,td:first-child,td.l,th.l{text-align:left}table.d td:nth-child(-n+3),table.d th:nth-child(-n+3){text-align:left}
.sc{overflow:auto}tr.tot td{color:var(--c);font-weight:700}
.tag{font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;letter-spacing:.08em;text-transform:uppercase}
.ok{color:var(--g)}.ko{color:var(--r)}.note{color:var(--mu);font-size:12px;margin:10px 2px}
.empty{text-align:center;padding:80px 20px;color:var(--mu)}.empty b{color:var(--c)}
dialog{background:#0b1222;color:var(--tx);border:1px solid var(--c);border-radius:16px;box-shadow:0 0 40px rgba(34,228,255,.25);width:min(560px,92vw)}dialog::backdrop{background:rgba(0,0,0,.6)}
dialog input{width:100%;margin:10px 0 16px}
</style></head><body>
<header><div class="logo">PAYSLIP<i>//</i>CORE</div><div class="dir mono" id="dir"></div>
<div class="pill"><span class="dot"></span><span id="st">sync…</span></div>
<button id="bSet">⚙ Cartella</button><button id="bRe">⟳ Rileggi tutto</button></header>
<nav id="nav"></nav><main id="app"></main>
<dialog id="dlg"><h3 style="margin:0;letter-spacing:.14em">CARTELLA BUSTE PAGA</h3>
<p class="note">Percorso della cartella con i PDF (anche sottocartelle). Il default è <span class="mono" id="def"></span>.</p>
<input id="inDir" class="mono"><label style="display:flex;gap:10px;align-items:center;margin:4px 0 8px"><input type="checkbox" id="bkOn" style="width:auto;margin:0"> Analizza anche l'home banking (spese, budget, risparmio)</label><p class="note" style="margin:0">Cartella degli estratti conto (lascia vuoto per <span class="mono">home_banking</span> dentro la cartella buste paga):</p><input id="bkDir" class="mono" placeholder="predefinita"><div style="display:flex;gap:10px;justify-content:flex-end"><button id="bDef">Default</button><button id="bX">Annulla</button><button id="bOk">Salva e scansiona</button></div></dialog>
<script src="vendor/chart.umd.js"></script>
<script src="banca.js"></script>
<script>
const CAT={retribuzione:["Retribuzione","#22e4ff"],indennita:["Indennità (EDR)","#7aa8ff"],straordinari:["Straordinari","#ff2bd6"],viaggio:["Ore viaggio","#c084fc"],rimborsi:["Rimborsi e trasferte","#a3ff12"],conguaglio:["Conguaglio fiscale","#ffb020"],
inps:["INPS","#ff4d6d"],irpef:["IRPEF","#ff8a3d"],addizionali:["Addizionali","#ffd23d"],imposte_sost:["Imposte sostitutive","#f472b6"],prev_compl:["Prev. complementare","#2dd4bf"],mensa:["Mensa / ticket","#94a3b8"],welfare:["Welfare","#34d399"],premi:["Premi","#60a5fa"],assenze:["Assenze","#64748b"],altro:["Altro","#475569"]};
const MESI=["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
const TABS=[["pan","Panoramica"],["comp","Componenti"],["tax","Tasse & INPS"],["rim","Rimborsi & Straordinari"],["tfr","Ferie & TFR"],["det","Dettaglio"]];
let D=null,tab="pan",sel=null,catSel="tutte",charts={},sig="";
const $=s=>document.querySelector(s),eur=n=>(n==null||isNaN(n))?"—":n.toLocaleString("it-IT",{style:"currency",currency:"EUR"}),
n2=n=>(n==null||isNaN(n))?"—":n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2}),pc=n=>isFinite(n)?n.toFixed(1).replace(".",",")+"%":"—",
lab=p=>MESI[+p.mese-1]+" "+String(p.anno).slice(2),S=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
Chart.defaults.color="#8fa1c9";Chart.defaults.font.family="ui-monospace,Menlo,monospace";Chart.defaults.borderColor="rgba(80,140,255,.12)";
const sumCat=(p,c,t)=>S(p.voci.filter(v=>v.categoria===c),v=>t==="c"?v.competenza_importo:v.trattenuta);
const sumCode=(p,code)=>S(p.voci.filter(v=>v.codice===code),v=>v.trattenuta+v.competenza_importo);
const P=()=>D.payslips;
function mk(id,type,labels,sets,o={}){const el=document.getElementById(id);if(!el)return;charts[id]?.destroy();
 charts[id]=new Chart(el,{type,data:{labels,datasets:sets},options:Object.assign({responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
 plugins:{legend:{labels:{boxWidth:10,usePointStyle:true}},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${o.unit?n2(c.parsed.y)+o.unit:eur(c.parsed.y??c.parsed)}`}}},
 scales:type==="doughnut"?{}:{x:{stacked:!!o.stack},y:{stacked:!!o.stack,ticks:{callback:v=>o.unit?v+o.unit:v+" €"}}}},o.opt||{})})}
const ds=(label,data,color,extra={})=>Object.assign({label,data,backgroundColor:color+"cc",borderColor:color,borderWidth:2,tension:.35,pointRadius:3,borderRadius:4},extra);
const card=(t,body,ac)=>`<div class="card" style="--ac:${ac||"var(--c)"}"><h3>${t}</h3>${body}</div>`;
const kpi=(t,v,s,ac)=>card(t,`<div class="kv num">${v}</div><div class="sub">${s||""}</div>`,ac);
const delta=(a,b,inv)=>{if(b==null||!b)return"";const d=a-b;if(Math.abs(d)<0.005)return"invariato vs mese prec.";const good=inv?d<0:d>0;return `<span class="${good?"up":"dn"}">${d>=0?"▲":"▼"} ${eur(Math.abs(d))}</span> vs mese prec.`};
const cv=(id,t,tall)=>card(t,`<div class="cv ${tall?"t":""}"><canvas id="${id}"></canvas></div>`);
function trow(cells,cls){return `<tr class="${cls||""}">${cells.map((c,i)=>`<td class="${i?"num":"l"}">${c}</td>`).join("")}</tr>`}

function views(){
 const p=P(),L=p.map(lab),last=p[p.length-1],prev=p[p.length-2],T=x=>x.campi;
 const out={};
 out.pan=()=>{const tot=S(p,x=>T(x).netto),lord=S(p,x=>T(x).tot_competenze),tr=S(p,x=>T(x).tot_trattenute);
  return `<div class="grid k">${kpi("Netto "+lab(last),eur(T(last).netto),delta(T(last).netto,prev&&T(prev).netto),"var(--g)")}
  ${kpi("Lordo "+lab(last),eur(T(last).tot_competenze),delta(T(last).tot_competenze,prev&&T(prev).tot_competenze),"var(--c)")}
  ${kpi("Trattenute "+lab(last),eur(T(last).tot_trattenute),pc(T(last).tot_trattenute/T(last).tot_competenze*100)+" del lordo","var(--r)")}
  ${kpi("Netto medio",eur(tot/p.length),p.length+" buste · totale "+eur(tot),"var(--v)")}
  ${kpi("Prelievo medio",pc(tr/lord*100),"trattenute / competenze","var(--a)")}</div>
  <div class="grid g2" style="margin-top:16px">${cv("c1","Lordo · Trattenute · Netto",1)}${cv("c2","Dove vanno le competenze · ultimo mese",1)}</div>
  <p class="note">Le voci sono attribuite al mese della busta paga in cui vengono pagate (straordinari e rimborsi arrivano di solito col mese successivo).</p>`};
 out.pan.after=()=>{mk("c1","bar",L,[ds("Lordo",p.map(x=>T(x).tot_competenze),"#22e4ff"),ds("Trattenute",p.map(x=>T(x).tot_trattenute),"#ff4d6d"),ds("Netto",p.map(x=>T(x).netto),"#a3ff12",{type:"line",backgroundColor:"#a3ff1233",fill:true})]);
  const parts=[["Netto",T(last).netto,"#a3ff12"],["IRPEF + addizionali",sumCat(last,"irpef","t")+sumCat(last,"addizionali","t"),"#ff8a3d"],["INPS",sumCat(last,"inps","t"),"#ff4d6d"],["Prev. complementare",sumCat(last,"prev_compl","t"),"#2dd4bf"],["Altre trattenute",sumCat(last,"mensa","t")+sumCat(last,"imposte_sost","t")+sumCat(last,"altro","t")+sumCat(last,"conguaglio","t"),"#94a3b8"]].filter(x=>x[1]>0);
  mk("c2","doughnut",parts.map(x=>x[0]),[{data:parts.map(x=>x[1]),backgroundColor:parts.map(x=>x[2]+"cc"),borderColor:"#04060d",borderWidth:3}],{opt:{cutout:"62%",plugins:{tooltip:{callbacks:{label:c=>` ${c.label}: ${eur(c.parsed)}`}}}}})};
 out.comp=()=>{const rows={};p.forEach(x=>x.voci.forEach(v=>{if(v.tipo==="info")return;const k=v.categoria+"|"+v.codice;rows[k]=rows[k]||{cat:v.categoria,desc:v.descrizione,t:v.tipo,m:{}};rows[k].m[x.periodo]=(rows[k].m[x.periodo]||0)+v.competenza_importo+v.trattenuta}));
  const list=Object.values(rows).filter(r=>catSel==="tutte"||r.cat===catSel).sort((a,b)=>a.t.localeCompare(b.t)||a.cat.localeCompare(b.cat));
  const used=[...new Set(Object.values(rows).map(r=>r.cat))];
  const mkTab=t=>{const rs=list.filter(r=>r.t===t);if(!rs.length)return"";return `<tr class="tot"><td class="l" colspan="${p.length+2}">${t==="competenza"?"COMPETENZE":"TRATTENUTE"}</td></tr>`+rs.map(r=>trow([`<span style="color:${CAT[r.cat][1]}">●</span> ${r.desc} <span class="tag" style="color:${CAT[r.cat][1]}">${CAT[r.cat][0]}</span>`,...p.map(x=>r.m[x.periodo]?n2(r.m[x.periodo]):"·"),n2(S(Object.values(r.m),v=>v))])).join("")};
  return `<div class="grid g2">${cv("c1","Competenze per componente",1)}${cv("c2","Trattenute per componente",1)}</div>
  <div class="card" style="margin-top:16px"><h3>Matrice voci × mesi (€) <select id="fc" style="margin-left:12px"><option value="tutte">Tutte le componenti</option>${used.map(c=>`<option value="${c}" ${c===catSel?"selected":""}>${CAT[c][0]}</option>`).join("")}</select></h3>
  <div class="sc"><table><tr><th class="l">Voce</th>${L.map(l=>`<th>${l}</th>`).join("")}<th>Totale</th></tr>${mkTab("competenza")}${mkTab("trattenuta")}</table></div></div>`};
 out.comp.after=()=>{const bar=(t)=>Object.keys(CAT).filter(c=>p.some(x=>sumCat(x,c,t)>0)).map(c=>ds(CAT[c][0],p.map(x=>sumCat(x,c,t)),CAT[c][1]));
  mk("c1","bar",L,bar("c"),{stack:1});mk("c2","bar",L,bar("t"),{stack:1});$("#fc")?.addEventListener("change",e=>{catSel=e.target.value;render()})};
 out.tax=()=>{const irp=sumCat,tot=f=>S(p,f);const ir=tot(x=>irp(x,"irpef","t")),ad=tot(x=>irp(x,"addizionali","t")),inps=tot(x=>irp(x,"inps","t")),im=tot(x=>x.campi.imponibile_fiscale);
  const pr=last.campi;
  return `<div class="grid k">${kpi("IRPEF netta (totale)",eur(ir),"media "+eur(ir/p.length)+"/mese","var(--a)")}${kpi("Addizionali",eur(ad),"comunale + regionale","#ffd23d")}${kpi("INPS (IVS + CIGS)",eur(inps),"media "+eur(inps/p.length)+"/mese","var(--r)")}
  ${kpi("Aliquota effettiva IRPEF",pc((ir+ad)/im*100),"(IRPEF+add.) / imponibile fiscale","var(--m)")}${kpi("Detrazioni "+lab(last),eur(pr.detrazioni),"lavoro dipendente","var(--g)")}</div>
  <div class="grid g2" style="margin-top:16px">${cv("c1","Imposte e contributi per mese",1)}${cv("c2","Aliquote % per mese",1)}${cv("c3","Imponibili: fiscale vs previdenziale")}${cv("c4","Progressivi annui (da ultima busta)")}</div>`};
 out.tax.after=()=>{mk("c1","bar",L,[ds("IRPEF",p.map(x=>sumCat(x,"irpef","t")),"#ff8a3d"),ds("Addizionali",p.map(x=>sumCat(x,"addizionali","t")),"#ffd23d"),ds("INPS IVS",p.map(x=>sumCode(x,"Q_ST0021")),"#ff4d6d"),ds("INPS CIGS",p.map(x=>sumCode(x,"Q_ST0023")),"#ff2bd6"),ds("Imp. sostitutive",p.map(x=>sumCat(x,"imposte_sost","t")),"#f472b6"),ds("Prev. compl.",p.map(x=>sumCat(x,"prev_compl","t")),"#2dd4bf")],{stack:1});
  mk("c2","line",L,[ds("IRPEF+add. / imponibile fisc.",p.map(x=>(sumCat(x,"irpef","t")+sumCat(x,"addizionali","t"))/x.campi.imponibile_fiscale*100),"#ff8a3d"),ds("INPS / imponibile prev.",p.map(x=>(sumCat(x,"inps","t"))/x.campi.imponibile_prev*100),"#ff4d6d"),ds("Trattenute / lordo",p.map(x=>x.campi.tot_trattenute/x.campi.tot_competenze*100),"#22e4ff")],{unit:"%"});
  mk("c3","bar",L,[ds("Imponibile fiscale",p.map(x=>x.campi.imponibile_fiscale),"#22e4ff"),ds("Imponibile previdenziale",p.map(x=>x.campi.imponibile_prev),"#8b5cf6")]);
  const l=last.campi,pg=[["Imponibile fisc.",l.prog_imponibile_fisc],["Imposta netta",l.prog_imposta_netta],["Contributi IVS",l.prog_ivs],["CIGS",l.prog_cigs],["Detrazioni",l.prog_detrazioni]].filter(x=>x[1]!=null);
  mk("c4","bar",pg.map(x=>x[0]),[ds("Progressivo "+lab(last),pg.map(x=>x[1]),"#22e4ff")])};
 out.rim=()=>{const by=c=>p.map(x=>sumCat(x,c,"c")),R=S(by("rimborsi"),v=>v),ST=S(by("straordinari"),v=>v),VG=S(by("viaggio"),v=>v),oreST=S(p,x=>S(x.voci.filter(v=>v.categoria==="straordinari"),v=>v.quantita)),W=S(p,x=>S(x.voci.filter(v=>v.codice==="V_004199"),v=>v.dato_base));
  const rows=[];p.forEach(x=>x.voci.filter(v=>v.categoria==="rimborsi"&&v.tipo==="competenza"||v.categoria==="straordinari"||v.categoria==="viaggio").forEach(v=>rows.push([lab(x),v.descrizione,v.competenza||"",v.quantita!=null?n2(v.quantita):"",n2(v.competenza_importo)])));
  return `<div class="grid k">${kpi("Rimborsi e trasferte",eur(R),"totale periodo","var(--g)")}${kpi("Straordinari",eur(ST),n2(oreST)+" ore","var(--m)")}${kpi("Ore viaggio",eur(VG),"indennità di trasferta","#c084fc")}${kpi("Welfare / ticket",eur(W),"quota non tassata (art. 100)","#34d399")}</div>
  <div class="grid g2" style="margin-top:16px">${cv("c1","Rimborsi per mese",1)}${cv("c2","Straordinari e viaggio (€ e ore)",1)}</div>
  <div class="card" style="margin-top:16px"><h3>Dettaglio voci</h3><div class="sc">${rows.length?`<table><tr><th class="l">Busta</th><th class="l">Voce</th><th>Competenza</th><th>Qtà</th><th>Importo</th></tr>${rows.map(r=>trow(r)).join("")}</table>`:'<div class="note">Nessuna voce.</div>'}</div></div>`};
 out.rim.after=()=>{mk("c1","bar",L,[ds("Rimborsi",p.map(x=>sumCat(x,"rimborsi","c")),"#a3ff12"),ds("Welfare",p.map(x=>S(x.voci.filter(v=>v.codice==="V_004199"),v=>v.dato_base)),"#34d399")]);
  mk("c2","bar",L,[ds("Straordinari €",p.map(x=>sumCat(x,"straordinari","c")),"#ff2bd6"),ds("Ore viaggio €",p.map(x=>sumCat(x,"viaggio","c")),"#c084fc"),ds("Ore straordinario",p.map(x=>S(x.voci.filter(v=>v.categoria==="straordinari"),v=>v.quantita)),"#ffb020",{type:"line",yAxisID:"y1"})],{opt:{scales:{y:{ticks:{callback:v=>v+" €"}},y1:{position:"right",grid:{display:false},ticks:{callback:v=>v+" h"}}}}})};
 out.tfr=()=>{const l=last.campi;return `<div class="grid k">${kpi("Ferie residue",n2(l.ferie_residuo)+" gg","a "+lab(last),"var(--c)")}${kpi("Ex festività residue",n2(l.exfest_residuo)+" gg","","var(--v)")}${kpi("TFR maturato "+last.anno,eur(l.prog_tfr),"quota mensile "+eur(l.quota_tfr),"var(--g)")}${kpi("Fondo pensione (anno)",eur((l.prog_fpc_dip||0)+(l.prog_fpc_az||0)),"dip. "+eur(l.prog_fpc_dip)+" · az. "+eur(l.prog_fpc_az),"#2dd4bf")}</div>
  <div class="grid g2" style="margin-top:16px">${cv("c1","Ferie e ex festività residue",1)}${cv("c2","TFR e previdenza complementare",1)}</div>`};
 out.tfr.after=()=>{mk("c1","line",L,[ds("Ferie residue",p.map(x=>x.campi.ferie_residuo),"#22e4ff"),ds("Ex festività",p.map(x=>x.campi.exfest_residuo),"#8b5cf6")],{unit:" gg"});
  mk("c2","bar",L,[ds("Quota TFR mensile",p.map(x=>x.campi.quota_tfr),"#a3ff12"),ds("Contr. dipendente FPC",p.map(x=>x.campi.ctr_fpc_dip||0),"#2dd4bf"),ds("Contr. azienda FPC",p.map(x=>x.campi.ctr_fpc_az||0),"#7aa8ff"),ds("TFR progressivo",p.map(x=>x.campi.prog_tfr),"#ffb020",{type:"line",yAxisID:"y1"})],{opt:{scales:{y:{ticks:{callback:v=>v+" €"}},y1:{position:"right",grid:{display:false},ticks:{callback:v=>v+" €"}}}}})};
 out.det=()=>{const x=p.find(q=>q.periodo===sel)||last,c=x.campi,ck=x.controlli;const b=(k,t)=>`<span class="tag ${k?"ok":"ko"}">${t} ${k?"✓":"✗"}</span>`;
  return `<div class="card"><h3>Busta paga <select id="fs">${p.map(q=>`<option value="${q.periodo}" ${q.periodo===x.periodo?"selected":""}>${lab(q)} — ${q.file}</option>`).join("")}</select> ${b(ck.competenze_ok,"competenze")} ${b(ck.trattenute_ok,"trattenute")} ${b(ck.netto_ok,"netto")}</h3>
  <div class="grid k" style="margin-bottom:14px">${kpi("Competenze",eur(c.tot_competenze),"","var(--c)")}${kpi("Trattenute",eur(c.tot_trattenute),"","var(--r)")}${kpi("Netto",eur(c.netto),"","var(--g)")}${kpi("Imponibile fiscale",eur(c.imponibile_fiscale),"imposta lorda "+eur(c.imposta_lorda),"var(--a)")}</div>
